<div class="login">
  <cb-brand-panel class="login__panel">
    <p class="login__blurb">
      Un espacio de estudio, ritual y formación para practicantes de ocultismo, brujería
      tradicional y magia ritual.
    </p>
  </cb-brand-panel>

  <section class="login__main">
    <div class="login__center">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <a class="login__back" routerLink="/">← Volver al inicio</a>
        <div class="form__intro">
          <h1 class="form__title">Bienvenida a casa</h1>
          <p class="form__lead">Estás en una demostración. Puedes entrar con los campos vacíos.</p>
        </div>

        <div class="field">
          <label class="field__label" for="email">Correo electrónico</label>
          <input
            id="email"
            class="field__input"
            type="email"
            formControlName="email"
            autocomplete="email"
            inputmode="email"
            placeholder="correo@circulodebrujas.com"
          />
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <div class="field__wrap">
            <input
              id="password"
              class="field__input field__input--icon"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Ingresa tu contraseña"
            />
            <button
              type="button"
              class="field__toggle"
              (click)="togglePassword()"
              [attr.aria-pressed]="showPassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <cb-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="20" [stroke]="1.5" />
            </button>
          </div>
        </div>

        <button class="cb-btn form__submit" type="submit">
          Entrar
          <cb-icon name="arrow-right" [size]="18" />
        </button>

      </form>
    </div>

    <footer class="foot">
      <span>© {{ year }} Casa Círculo de Brujas</span>
      <span class="foot__lang">
        <cb-icon name="globe" [size]="14" [stroke]="1.5" />
        Español
      </span>
    </footer>

  </section>
</div>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Círculo de Brujas</title>
  <script>
    const base = '/circulo-de-brujas-prototipo/';
    if (location.pathname.startsWith(base) && location.pathname !== base) {
      const route = location.pathname.slice(base.length - 1);
      location.replace(base + '#' + route + location.search + location.hash);
    }
  </script>
</head>
<body>
  <p><a href="/circulo-de-brujas-prototipo/">Volver al inicio</a></p>
</body>
</html>
